{{ define "main" }}
{{ $copy := index .Site.Data .Language.Lang }}
<main class="flex min-h-screen items-center justify-center bg-background px-6 text-center">
<div><p class="font-script text-8xl text-gold">404</p>
<h1 class="mt-3 font-display text-3xl">{{ $copy.notFound.message }}</h1>
<a href="{{ .Site.Home.RelPermalink }}" class="mt-8 inline-flex rounded-full bg-emerald px-6 py-3 text-primary-foreground">{{ $copy.notFound.home }}</a></div>
</main>
{{ end }}
